[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "errlab"
version = "0.1.0"
description = "ErrLab: A/B testing CLI error messages with Flagsmith (Toggle Wars Track 01)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flagsmith>=6.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
errlab = "errlab.cli:main"
